[project]
name = "gdrives"
version = "0.16.1a0"
description = ""
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "python-dotenv>=1.2.3",
    "typer",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/gdrives"

[project.scripts]
gdrives = "gdrives.cli:app"

# proj-template release stamp, set by proj-init.sh and install-template; inert to consumers.
[tool.proj-template]
version = "0.11.7"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdrives"]

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs; a leading "/" anchors each path to the root.
# hatchling always adds pyproject.toml, PKG-INFO, and .gitignore, so keep secrets out of them.
only-include = [
    "/gdrives",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov",
    # Same minor as the ruff-pre-commit rev in .pre-commit-config.yaml; bump the two together.
    "ruff>=0.17,<0.18",
    "types-httplib2>=0.32.0.20260720",
    "types-oauthlib>=3.3.0.20260724",
]

[tool.ruff]
target-version = "py311"
# ruff formats Python fences in Markdown; keep it off plans and the changelog.
extend-exclude = [".planners/", "CHANGELOG.md"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]
# tests import shared helpers as bare modules (e.g. `from helpers import ...`),
# matching pytest's `pythonpath = ["tests"]`; let pyrefly resolve them too.
search-path = ["tests"]

# tests/ stays type-checked, but unannotated pytest fixture params don't fail implicit-any.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov --cov-report=term-missing"
markers = [
    "integration: live tests needing a service account + GDRIVES_TEST_SPREADSHEET_ID / GDRIVES_TEST_DOCUMENT_ID (skipped otherwise)",
]

[tool.coverage.run]
source = ["gdrives"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
