[project]
name = "gdrives"
version = "0.15.1a0"
description = ""
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "python-dotenv>=1.2.3",
    "typer",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/gdrives"

[project.scripts]
gdrives = "gdrives.cli:app"

# Which proj-template release this repo was scaffolded from, stamped by
# proj-init.sh and re-stamped by the install-template skill on upgrade. Inert to
# consumers: build backends translate only [project], so this never reaches the
# wheel or the PyPI metadata. Read it to audit template drift across repos.
[tool.proj-template]
version = "0.10.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdrives"]

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs. Root-anchored (leading "/") so bare
# filenames don't glob at every depth — this keeps internal plan files
# (.planners/), guides (docs/), the .claude/ holder, tests, and tooling out of
# the published sdist.
#
# Not exhaustive: hatchling force-includes pyproject.toml, PKG-INFO, and
# .gitignore in every sdist regardless of this list, and neither `exclude` nor
# `ignore-vcs` drops them. Wheels are unaffected — they carry only the package
# and .dist-info — so treat anything in this file as sdist-visible and keep
# secrets out of it. Adding a path here does not make it importable; wheel
# contents come from the package dir, not this list.
only-include = [
    "/gdrives",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov",
    "ruff>=0.16.4",
    "types-httplib2>=0.32.0.20260720",
    "types-oauthlib>=3.3.0.20260724",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]
# tests import shared helpers as bare modules (e.g. `from helpers import ...`),
# matching pytest's `pythonpath = ["tests"]`; let pyrefly resolve them too.
search-path = ["tests"]

# tests/ stays type-checked (imports, undefined names, type mismatches),
# but the implicit-any check is relaxed there so unannotated pytest fixture
# params (e.g. `def test_x(tmp_path):`) don't force annotations.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov --cov-report=term-missing"
markers = [
    "integration: live tests needing a service account + GDRIVES_TEST_SPREADSHEET_ID / GDRIVES_TEST_DOCUMENT_ID (skipped otherwise)",
]

[tool.coverage.run]
source = ["gdrives"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
